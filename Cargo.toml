[package]
name = "postfix-rest-api-connector"
version = "1.0.7"
edition = "2024"
authors = ["dutty5"]
description = "REST API connector for Postfix mail server"
license = "MIT"

[[bin]]
name = "postfix-rest-api-connector"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.52.3", features = ["full"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
anyhow = "1.0.102"
env_logger = "0.11.10"
log = "0.4.32"
url = "2.5.8"
percent-encoding = "2.3.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
